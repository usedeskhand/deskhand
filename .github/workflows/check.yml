name: check
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Every module parses
        run: for f in server.mjs lib/*.mjs test/*.mjs; do node --check "$f"; done
      - name: The brief reader reads the examples
        run: node --input-type=module -e "import { read, EXAMPLES } from './lib/brief.mjs'; for (const b of EXAMPLES) { const r = read(b); if (!r.config) { console.error(b, r.error); process.exit(1) } } console.log(EXAMPLES.length, 'briefs read')"
